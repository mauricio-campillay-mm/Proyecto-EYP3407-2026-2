# Prueba de reproducibilidad en equipos nuevos de GitHub (Linux y Windows).
# Instala todo desde cero y ejecuta el comando único. Las tablas y figuras
# generadas quedan como artefacto descargable para compararlas con el informe.
name: Reproducibilidad

on:
  push:
    branches: [main, avance-fases-3-6]
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  analisis:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Instalar R 4.6.2
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
          use-public-rspm: true

      - name: Instalar paquetes de renv.lock
        timeout-minutes: 30
        run: Rscript --vanilla instalar.R

      - name: Ejecutar el análisis completo
        timeout-minutes: 60
        run: Rscript --vanilla analisis.R

      - name: Guardar tablas y figuras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.os }}
          path: |
            output/tablas
            output/figuras
            output/sessionInfo.txt
